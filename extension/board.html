<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bounty Board</title>
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1 class="wordmark" id="wordmark">Bounty Board</h1>
        <p class="stats" id="stats"></p>
        <p class="sub" id="subtitle"></p>
      </header>

      <section class="filters">
        <label class="ctl">
          <span class="label" data-i18n="filter.minMoney">Min pay</span>
          <input id="minMoney" type="number" min="0" step="10" data-i18n-ph="ph.any" placeholder="any" />
          <span class="unit" data-i18n="filter.unitMoney">¥</span>
        </label>
        <label class="ctl">
          <span class="label" data-i18n="filter.maxMinutes">Max time</span>
          <input id="maxMinutes" type="number" min="0" step="5" data-i18n-ph="ph.any" placeholder="any" />
          <span class="unit" data-i18n="filter.unitMinutes">min</span>
        </label>
        <label class="ctl">
          <span class="label" data-i18n="filter.days">Window</span>
          <input id="days" type="number" min="1" max="60" value="7" />
          <span class="unit" data-i18n="filter.unitDays">days</span>
        </label>
        <label class="ctl">
          <span class="label" data-i18n="filter.sort">Sort</span>
          <select id="sort">
            <option value="priority" data-i18n="sort.priority">Stars</option>
            <option value="hourly" data-i18n="sort.hourly">Rate</option>
            <option value="money" data-i18n="sort.money">Pay</option>
            <option value="minutes" data-i18n="sort.minutes">Time</option>
          </select>
        </label>
        <label class="ctl">
          <span class="label" data-i18n="lang.label">Lang</span>
          <select id="lang">
            <option value="en">EN</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <button id="rescan" class="btn solid" data-i18n="action.rescan">Rescan</button>
      </section>

      <p class="note" id="note"></p>

      <section id="list" class="list"></section>

      <footer class="foot">
        <button id="diag" class="btn text" data-i18n="action.diag">Diagnose</button>
        <button id="copy" class="btn text" data-i18n="action.copy">Copy debug</button>
        <button id="reload" class="btn text" data-i18n="action.reload">Reload extension</button>
        <details class="debug">
          <summary data-i18n="debug.summary">Debug info</summary>
          <pre id="debug"></pre>
        </details>
      </footer>
    </main>
    <script src="board.js"></script>
  </body>
</html>

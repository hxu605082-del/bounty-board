<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        width: 250px;
        padding: 14px;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: 0.06em; }
      p.hint { margin: 0 0 12px; opacity: 0.6; font-size: 11px; }
      button {
        display: block;
        width: 100%;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: CanvasText; color: Canvas; border-color: CanvasText; font-weight: 600; }
      button:hover { filter: brightness(1.08); }
      #status { margin-top: 6px; font-size: 11px; opacity: 0.65; min-height: 28px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1 id="title">Bounty Board</h1>
    <p class="hint" id="hint">Open your Outlook inbox first, then rescan.</p>
    <button id="scan" class="primary">Scan current Outlook</button>
    <button id="board">Open the board</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
